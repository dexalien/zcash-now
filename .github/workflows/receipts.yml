name: receipts

# Re-runs the free recipes (read + pure) and re-verifies the last spend txid
# over gRPC. Spends never run here: this runner holds no wallet, by design.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  # So receipts appear right after a merge, not at the next :17. The runner's
  # own commits use GITHUB_TOKEN and so do not re-trigger this; the ignore list
  # is a second guard against a loop.
  push:
    branches: [main]
    paths-ignore:
      - receipts.json
      - receipts-history.jsonl
      - STATUS.md
      - llms.txt

permissions:
  contents: write

concurrency:
  group: receipts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc
      # A red recipe sets a non-zero exit code; still commit its receipt, then fail.
      - id: recipes
        run: node dist/runner.js
        continue-on-error: true
      - name: Commit receipts
        run: |
          git config user.name "zcash-now receipts"
          git config user.email "receipts@users.noreply.github.com"
          git add receipts.json receipts-history.jsonl STATUS.md llms.txt
          git diff --cached --quiet || git commit -m "receipts: block $(node -p "require('./receipts.json').blockHeight")"
          git pull --rebase --autostash && git push
      - if: steps.recipes.outcome == 'failure'
        run: exit 1
